<!DOCTYPE html>
<html>
<head><title>Industry Catalog</title></head>
<body style="font-family: Arial; padding: 20px; max-width: 1200px; margin: auto;">
    <a href="/" style="text-decoration: none; color: #0b1f3a; font-weight: bold;">&larr; Back to Home</a>
    <h1 style="text-transform: capitalize;">{{ industry_slug|replace:"_, " }} Products</h1>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
        {% for product in products %}
            <div style="border: 1px solid #ddd; padding: 15px;">
                <h3><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></h3>
                <p>Price: ${{ product.price }}</p>
            </div>
        {% empty %}
            <p>No products found for this category.</p>
        {% endfor %}
    </div>
</body>
</html>
